[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repohealth-analyzer"
version = "1.0.0"
description = "Detects code-quality degradation against each file's own history and blocks it at commit time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Suyash Agrawaal" }]
keywords = ["static-analysis", "code-quality", "technical-debt", "git-hooks"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
  "GitPython>=3.1.40",
  "radon>=6.0.1",
  # Grammars for C++, Java, JavaScript and TypeScript. Ships prebuilt wheels
  # on every platform, so there is no compiler step on Windows. Python is not
  # analysed through this -- it keeps the standard library's own parser.
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=1.10",
]

[project.optional-dependencies]
# The dashboard is optional: the CLI and the gatekeeper work without a web
# server, so a developer who only wants the commit hook installs nothing extra.
dashboard = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
repohealth = "repohealth.cli:main"

[tool.setuptools.packages.find]
include = ["repohealth*"]

[tool.setuptools.package-data]
# schema.sql and the dashboard must ship inside the wheel, not just the repo.
repohealth = ["db/*.sql", "web/*.html", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
